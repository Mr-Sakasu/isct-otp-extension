<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Science Tokyo Autofill</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:620px;margin:2rem auto;padding:0 1rem;color:#183044}h1{font-size:1.5rem}label{display:block;margin:1rem 0 .3rem;font-weight:600}input{box-sizing:border-box;width:100%;font:inherit;padding:.6rem;border:1px solid #8093a1;border-radius:5px}button{font:inherit;margin:.8rem .4rem 0 0;padding:.5rem .9rem;border:0;border-radius:5px;background:#0870a8;color:white;cursor:pointer}.secondary{background:#536575}small{display:block;color:#485e6d}details,section{margin-top:1.3rem}summary{cursor:pointer}#currentCode{font-size:1.8rem;font-variant-numeric:tabular-nums;letter-spacing:.15em}#status{min-height:1.5rem}#migration{background:#eef6ff;padding:1rem;border-radius:6px}[hidden]{display:none!important}</style></head>
<body>
<nav aria-label="言語"><a href="options.html" lang="en">English</a> · <a href="options.ja.html" lang="ja">日本語</a> · <a href="options.zh-CN.html" lang="zh-CN">简体中文</a></nav>
<h1>Science Tokyo Autofill</h1>
<p>入力した項目だけでも保存できます。残りはあとから追加でき、空欄の項目は保存済みの内容を使います。</p>
<section id="migration" hidden><p>旧版の設定は、以前のパスフレーズを一度入力すると引き継げます。</p><label for="legacyPassphrase">以前のパスフレーズ</label><input id="legacyPassphrase" type="password" autocomplete="off"><button id="migrate" type="button">引き継ぐ</button></section>
<label for="secret">設定キー</label>
<input id="secret" type="password" autocomplete="off" spellcheck="false" placeholder="Show secret key の文字列を貼り付け">
<small>空欄で保存すると、保存済みのキーをそのまま使います。</small>
<label for="username">大学のユーザー名</label>
<input id="username" type="text" autocomplete="off" spellcheck="false" maxlength="256">
<label for="universityPassword">大学のログインパスワード</label>
<input id="universityPassword" type="password" autocomplete="off" spellcheck="false" maxlength="1024" placeholder="空欄なら保存済みのまま">
<button id="save" type="button">保存</button>
<p id="status" role="status" aria-live="polite"></p>
<small id="secretState" role="status"></small>
<section id="codeSection" hidden><label for="currentCode">現在のコード</label><output id="currentCode"></output><small id="codeExpiry"></small><small>大学の登録画面でコードを求められたら、この6桁を入力します。</small></section>
<p><a href="help.ja.html">設定ガイド</a></p>
<small>データはこのChromeプロファイル内に保存されます。自分専用のパソコンで使ってください。</small>
<details id="savedData"><summary>保存データの確認・削除</summary><button id="showKey" class="secondary" type="button">保存した内容を表示</button><section id="revealedSettings" hidden><label for="revealedUsername">保存したユーザー名</label><input id="revealedUsername" type="text" readonly autocomplete="off" spellcheck="false" placeholder="未保存"><label for="revealedPassword">保存したパスワード</label><input id="revealedPassword" type="text" readonly autocomplete="off" spellcheck="false" placeholder="未保存"><label for="revealedKey">保存した設定キー</label><input id="revealedKey" type="text" readonly hidden autocomplete="off" spellcheck="false" placeholder="未保存"></section><button id="removeSecret" class="secondary" type="button">保存データを削除</button></details>
<script src="options-i18n.js"></script><script src="options.js"></script>
</body></html>
