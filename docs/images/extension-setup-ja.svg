<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img"><title>3. 拡張機能に貼り付けて保存する</title><style>text{font-family:"Meiryo","メイリオ",sans-serif}</style><rect width="900" height="555" fill="#f3f7fb"/><rect x="30" y="75" width="840" height="400" rx="10" fill="#fff" stroke="#c7d5e1"/><rect x="52" y="130" width="766" height="48" rx="10" fill="#fff" stroke="#c7d5e1"/><rect x="52" y="230" width="766" height="48" rx="10" fill="#fff" stroke="#c7d5e1"/><rect x="52" y="330" width="766" height="48" rx="10" fill="#fff" stroke="#c7d5e1"/><rect x="52" y="417" width="250" height="60" rx="8" fill="#0870a8"/><text x="34" y="48" font-size="26" fill="#183044">3. 拡張機能に貼り付けて保存する</text><text x="52" y="115" font-size="22" fill="#183044">設定キー</text><text x="70" y="161" font-size="24" fill="#183044">YOUR_SECRET_KEY</text><text x="52" y="215" font-size="22" fill="#183044">大学のユーザー名（任意）</text><text x="70" y="261" font-size="22" fill="#183044">your-science-tokyo-id</text><text x="52" y="315" font-size="22" fill="#183044">大学のログインパスワード（任意）</text><text x="70" y="361" font-size="22" fill="#183044">••••••••••</text><text x="68" y="454" font-size="22" fill="#fff">保存</text><text x="34" y="525" font-size="17" fill="#183044">簡略化した図です。キーは架空の例です。</text></svg>
