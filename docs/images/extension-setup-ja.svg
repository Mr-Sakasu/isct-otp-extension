<svg xmlns="http://www.w3.org/2000/svg" width="900" height="795" viewBox="0 0 900 795" role="img"><title>3. ログイン情報と設定キーを暗号化して保存する</title><style>text{font-family:system-ui,"Noto Sans CJK JP","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="900" height="795" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">3. ログイン情報と設定キーを暗号化して保存する</text><rect x="30" y="75" width="840" height="635" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="115" font-size="22" fill="#183044" font-weight="600">大学のユーザー名（Science Tokyo ID）</text><rect x="52" y="127" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="161" font-size="23" fill="#183044" font-weight="400">your-science-tokyo-id</text><text x="52" y="215" font-size="22" fill="#183044" font-weight="600">大学のログインパスワード</text><rect x="52" y="227" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="261" font-size="23" fill="#183044" font-weight="400">••••••••••</text><text x="52" y="315" font-size="22" fill="#183044" font-weight="600">設定キー</text><rect x="52" y="327" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="361" font-size="23" fill="#183044" font-weight="400">YOUR_SECRET_KEY</text><text x="52" y="415" font-size="22" fill="#183044" font-weight="600">暗号化用パスフレーズ（6文字以上）</text><rect x="52" y="427" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="461" font-size="23" fill="#183044" font-weight="400">••••••••••••••••</text><text x="52" y="515" font-size="22" fill="#183044" font-weight="600">暗号化用パスフレーズ（確認のためもう一度）</text><rect x="52" y="527" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="561" font-size="23" fill="#183044" font-weight="400">••••••••••••••••</text><rect x="52" y="623" width="270" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="68" y="654" font-size="19" fill="#fff" font-weight="600">設定を保存</text><text x="345" y="645" font-size="17" fill="#183044" font-weight="400">大学のパスワードとは別のものを決めます。</text><text x="345" y="670" font-size="17" fill="#183044" font-weight="400">6文字は最低限の条件です。長いほど推測されにくくなります。</text><text x="34" y="753" font-size="18" fill="#183044" font-weight="400">画面を簡略化した図です。図中の文字列は架空の例で、本物のキーではありません。</text></svg>