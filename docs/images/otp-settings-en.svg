<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img"><title>Open OTP app settings</title><style>text{font-family:"Meiryo","メイリオ",sans-serif}.mono{font-family:"Meiryo","メイリオ",sans-serif}</style><rect width="900" height="555" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">1. Open OTP app settings</text><rect x="30" y="75" width="840" height="140" rx="10" fill="#ffffff" stroke="#c7d5e1"/><rect x="30" y="75" width="840" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="52" y="107" font-size="22" fill="#fff" font-weight="600">Multi-factor authentication (OTP)</text><text x="52" y="166" font-size="23" fill="#183044" font-weight="600">App Authentication</text><rect x="658" y="138" width="175" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="674" y="169" font-size="19" fill="#fff" font-weight="600">Settings</text><text x="34" y="258" font-size="26" fill="#183044" font-weight="700">2. If app authentication was already used</text><rect x="30" y="285" width="840" height="180" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="335" font-size="23" fill="#183044" font-weight="600">App Authentication</text><text x="52" y="390" font-size="22" fill="#183044" font-weight="400">Registered</text><rect x="658" y="319" width="175" height="48" rx="10" fill="#c74747" stroke="#c74747"/><text x="674" y="350" font-size="19" fill="#fff" font-weight="600">Remove</text><text x="34" y="515" font-size="18" fill="#183044" font-weight="400">Diagram only. Example text is not a real secret.</text></svg>