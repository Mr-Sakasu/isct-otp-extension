<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img"><title>2. シークレットキーを表示してコピーする</title><style>text{font-family:"Meiryo","メイリオ",sans-serif}.mono{font-family:"Meiryo","メイリオ",sans-serif}</style><rect width="900" height="590" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">2. シークレットキーを表示してコピーする</text><rect x="30" y="75" width="840" height="210" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="113" font-size="22" fill="#183044" font-weight="600">アプリ認証 / App Authentication</text><rect x="52" y="143" width="520" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="68" y="174" font-size="19" fill="#fff" font-weight="600">シークレットキーを表示する / Show secret key</text><rect x="52" y="210" width="766" height="50" rx="10" fill="#eaf6ff" stroke="#c7d5e1"/><text x="70" y="243" font-size="24" fill="#183044" font-weight="400">YOUR_SECRET_KEY</text><text x="34" y="335" font-size="26" fill="#0870a8" font-weight="700">↓ コピーして「設定キー」欄に貼り付け</text><rect x="30" y="365" width="840" height="140" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="410" font-size="22" fill="#183044" font-weight="600">拡張機能の設定画面：設定キー</text><rect x="52" y="433" width="766" height="48" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="465" font-size="24" fill="#183044" font-weight="400">YOUR_SECRET_KEY</text><text x="34" y="550" font-size="18" fill="#183044" font-weight="400">簡略化した図です。キーは架空の例です。</text></svg>