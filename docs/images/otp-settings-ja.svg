<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img"><title>1. OTP のアプリ認証設定を開く</title><style>text{font-family:system-ui,"Noto Sans CJK JP","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="900" height="555" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">1. OTP のアプリ認証設定を開く</text><rect x="30" y="75" width="840" height="140" rx="10" fill="#ffffff" stroke="#c7d5e1"/><rect x="30" y="75" width="840" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="52" y="107" font-size="22" fill="#fff" font-weight="600">多要素認証（OTP）</text><text x="52" y="166" font-size="23" fill="#183044" font-weight="600">アプリ認証 / App Authentication</text><rect x="658" y="138" width="175" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="674" y="169" font-size="19" fill="#fff" font-weight="600">設定 / Settings</text><text x="34" y="258" font-size="26" fill="#183044" font-weight="700">すでにアプリ認証を登録済みの場合</text><rect x="30" y="285" width="840" height="205" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="335" font-size="23" fill="#183044" font-weight="600">アプリ認証 / App Authentication</text><text x="52" y="372" font-size="20" fill="#183044" font-weight="400">登録済み</text><rect x="658" y="319" width="175" height="48" rx="10" fill="#c74747" stroke="#c74747"/><text x="674" y="350" font-size="19" fill="#fff" font-weight="600">解除 / Remove</text><text x="52" y="412" font-size="19" fill="#183044" font-weight="400">キーをもう表示できない場合だけ、「解除」で大学側の登録を削除し、</text><text x="52" y="442" font-size="19" fill="#183044" font-weight="400">もう一度「設定」から登録します。古いキーは使えなくなります。</text><text x="52" y="472" font-size="19" fill="#183044" font-weight="400">今の有効なキーを控えてある場合は、削除する必要はありません。</text><text x="34" y="530" font-size="18" fill="#183044" font-weight="400">画面を簡略化した図です。図中の文字列は架空の例で、本物のキーではありません。</text></svg>