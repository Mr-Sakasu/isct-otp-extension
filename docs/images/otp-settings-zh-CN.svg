<svg xmlns="http://www.w3.org/2000/svg" width="900" height="555" viewBox="0 0 900 555" role="img"><title>打开OTP应用认证设置</title><style>text{font-family:system-ui,"Noto Sans CJK JP","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="900" height="555" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">1. 打开OTP应用认证设置</text><rect x="30" y="75" width="840" height="140" rx="10" fill="#ffffff" stroke="#c7d5e1"/><rect x="30" y="75" width="840" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="52" y="107" font-size="22" fill="#fff" font-weight="600">多因素认证（OTP）</text><text x="52" y="166" font-size="23" fill="#183044" font-weight="600">应用认证 / App Authentication</text><rect x="658" y="138" width="175" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="674" y="169" font-size="19" fill="#fff" font-weight="600">设置 / Settings</text><text x="34" y="258" font-size="26" fill="#183044" font-weight="700">2. 已使用应用认证的情况</text><rect x="30" y="285" width="840" height="180" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="335" font-size="23" fill="#183044" font-weight="600">应用认证 / App Authentication</text><text x="52" y="390" font-size="22" fill="#183044" font-weight="400">已设置</text><rect x="658" y="319" width="175" height="48" rx="10" fill="#c74747" stroke="#c74747"/><text x="674" y="350" font-size="19" fill="#fff" font-weight="600">解除 / Remove</text><text x="34" y="515" font-size="18" fill="#183044" font-weight="400">此图仅为界面示意，示例文字不是实际密钥。</text></svg>