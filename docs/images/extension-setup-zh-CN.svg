<svg xmlns="http://www.w3.org/2000/svg" width="900" height="795" viewBox="0 0 900 795" role="img"><title>加密保存登录信息</title><style>text{font-family:system-ui,"Noto Sans CJK JP","Microsoft YaHei",sans-serif}.mono{font-family:monospace}</style><rect width="900" height="795" fill="#f3f7fb"/><text x="34" y="48" font-size="28" fill="#183044" font-weight="700">加密保存登录信息</text><rect x="30" y="75" width="840" height="635" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="52" y="115" font-size="22" fill="#183044" font-weight="600">大学用户名</text><rect x="52" y="127" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="161" font-size="23" fill="#183044" font-weight="400">your-science-tokyo-id</text><text x="52" y="215" font-size="22" fill="#183044" font-weight="600">大学登录密码</text><rect x="52" y="227" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="261" font-size="23" fill="#183044" font-weight="400">••••••••••</text><text x="52" y="315" font-size="22" fill="#183044" font-weight="600">设置密钥</text><rect x="52" y="327" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="361" font-size="23" fill="#183044" font-weight="400">YOUR_SECRET_KEY</text><text x="52" y="415" font-size="22" fill="#183044" font-weight="600">加密口令（至少6个字符）</text><rect x="52" y="427" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="461" font-size="23" fill="#183044" font-weight="400">••••••</text><text x="52" y="515" font-size="22" fill="#183044" font-weight="600">再次输入加密口令</text><rect x="52" y="527" width="766" height="50" rx="10" fill="#ffffff" stroke="#c7d5e1"/><text x="70" y="561" font-size="23" fill="#183044" font-weight="400">••••••</text><rect x="52" y="623" width="270" height="48" rx="10" fill="#0870a8" stroke="#0870a8"/><text x="68" y="654" font-size="19" fill="#fff" font-weight="600">保存设置</text><text x="34" y="753" font-size="18" fill="#183044" font-weight="400">此图仅为界面示意，示例文字不是实际密钥。</text></svg>